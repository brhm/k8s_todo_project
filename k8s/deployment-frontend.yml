apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend-deployment
  labels:
    app: frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: frontend
          image: brhmkskn/k8sproject_frontend:proje
          ports:
            - containerPort: 80
          resources:
            requests:
              memory: "128Mi"
              cpu: "250m"
            limits:
              memory: "128Mi"
              cpu: "500m"
---
apiVersion: v1
kind: Service
metadata:
  name: frontend-service
spec:
  type: ClusterIP # ingress.yml, # The service is accessible only within the Kubernetes cluster. External traffic is routed to this service through the Ingress Controller.
  selector:
    app: frontend
  ports:
    - protocol: TCP
      port: 3000
      targetPort: 80
